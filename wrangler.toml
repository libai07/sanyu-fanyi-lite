# 三语翻译 · Lite — Cloudflare Pages 配置
name = "sanyu-fanyi-lite"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./public"

# 必需密钥请通过 Cloudflare Dashboard → Settings → Variables and Secrets 设置：
#   NVIDIA_API_KEY = NVIDIA NIM API Key（Secret）
# 不要把真实密钥写入此文件或提交到 Git。

[vars]
MODEL = "nvidia/nemotron-3-ultra-550b-a55b"
RATE_LIMIT_MAX = "15"
RATE_LIMIT_WINDOW_SECONDS = "60"
TIMEOUT_MS = "60000"
MAX_SOURCE_LENGTH = "20000"
MAX_REQUEST_BYTES = "100000"
MIN_INTERVAL_MS = "4800"

# 推荐：创建 Cloudflare KV namespace 后，在 Dashboard 中绑定变量 RATE_LIMIT_KV，
# 或取消注释并替换真实 namespace id。没有 KV 时使用单 isolate 内存限流（尽力而为）。
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "replace-with-your-kv-namespace-id"